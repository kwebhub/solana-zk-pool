global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: "zkpool"

scrape_configs:
  - job_name: "zkpool-backend"
    static_configs:
      - targets: ["host.docker.internal:4001"]
        labels:
          service: "backend"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
