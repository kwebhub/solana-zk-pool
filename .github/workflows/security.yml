name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny (backend)
        working-directory: services/backend
        run: cargo deny check

      - name: Run cargo-deny (prover)
        working-directory: services/prover
        run: cargo deny check

  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      - name: Run cargo-audit (backend)
        working-directory: services/backend
        run: cargo audit --deny warnings
        continue-on-error: true

      - name: Run cargo-audit (prover)
        working-directory: services/prover
        run: cargo audit --deny warnings
        continue-on-error: true

  npm-audit:
    name: pnpm audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: pnpm audit (frontend)
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
        continue-on-error: true

      - name: pnpm audit (merkle)
        working-directory: services/merkle
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level high
        continue-on-error: true

  trivy:
    name: Trivy (Docker images)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -t zkpool-backend:scan services/backend

      - name: Build merkle image
        run: docker build -t zkpool-merkle:scan services/merkle

      - name: Run Trivy (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: zkpool-backend:scan
          format: "sarif"
          output: "trivy-backend.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Run Trivy (merkle)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: zkpool-merkle:scan
          format: "sarif"
          output: "trivy-merkle.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-backend.sarif"
          category: "trivy-backend"

      - name: Upload Trivy results (merkle)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-merkle.sarif"
          category: "trivy-merkle"

  gitleaks:
    name: Gitleaks (secrets scan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

  security-success:
    name: Security success
    needs: [cargo-deny, cargo-audit, npm-audit, trivy, gitleaks]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [ "${{ needs.cargo-deny.result }}" != "success" ]; then
            echo "cargo-deny failed"
            exit 1
          fi
          echo "Security checks passed ✅"
