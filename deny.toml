# ============================================================
# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
# ============================================================

[graph]
targets = [{ triple = "x86_64-unknown-linux-gnu" }]

# ============================================================
# LICENSES
# ============================================================
[licenses]
version = 2
confidence-threshold = 0.8

allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "0BSD",
]

private = { ignore = true }

# ============================================================
# ADVISORIES
# ============================================================
[advisories]
version = 2
yanked = "warn"

# ============================================================
# BANS
# ============================================================
[bans]
multiple-versions = "allow"
wildcards = "allow"
highlight = "all"
deny = []

# ============================================================
# SOURCES
# ============================================================
[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-git = []
